<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seca Product Monitor - Access Required</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <!-- Password Gate Modal -->
    <div class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 px-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 fade-in">
            <!-- Icon -->
            <div class="flex justify-center mb-6">
                <div class="bg-blue-100 rounded-full p-4">
                    <i class="fas fa-shield-halved text-blue-600 text-4xl"></i>
                </div>
            </div>

            <!-- Title -->
            <h1 class="text-3xl font-bold text-center text-gray-900 mb-2">
                Seca Product Monitor
            </h1>
            <p class="text-center text-gray-600 mb-8">
                Enter password to access dashboard
            </p>

            <!-- Error Message -->
            {% if error %}
            <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-6 fade-in">
                <div class="flex items-center">
                    <i class="fas fa-exclamation-circle mr-2"></i>
                    <span>Incorrect password. Please try again.</span>
                </div>
            </div>
            {% endif %}

            <!-- Password Form -->
            <form method="POST" action="{% url 'authenticate' %}" id="password-form">
                {% csrf_token %}
                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        Password
                    </label>
                    <input
                        type="password"
                        name="password"
                        id="password"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-lg"
                        placeholder="Enter password"
                        autocomplete="off"
                        autofocus
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-200 ease-in-out transform hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                >
                    <i class="fas fa-arrow-right mr-2"></i>
                    Access Dashboard
                </button>
            </form>

            <!-- Footer -->
            <div class="mt-8 text-center">
                <p class="text-sm text-gray-500">
                    <i class="fas fa-lock mr-1"></i>
                    Internal Use Only
                </p>
            </div>
        </div>
    </div>

    <script>
        // Auto-focus password field
        document.getElementById('password').focus();

        // Handle Enter key submission
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('password-form').submit();
            }
        });
    </script>
</body>
</html>
